name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_TOKEN is a classic PAT with repo scope on
          # c3-oss/homebrew-prosa. goreleaser uses it to push the
          # updated Casks/prosa.rb on each release. Rotate every
          # 6 months (see docs/release-runbook.md).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # actions/setup-node@v7 enables Corepack when package.json declares
      # `packageManager`, which prepares the pinned pnpm. Without pnpm on
      # PATH, the action fails — so install pnpm explicitly first. The
      # npm publish step itself uses `npm publish`, not pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # package-manager-cache: false skips the pnpm-cache save step
      # that fails on this job with "Path Validation Error: Path(s)
      # specified in the action for caching do(es) not exist". We
      # don't run `pnpm install` here so the cache directory never
      # materializes; the publish step uses `npm publish` directly.
      - name: Set up Node.js for npm publish
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; Node's bundled npm may be older.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish npm packages
        run: ./scripts/publish-npm.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Three images, one per binary, sharing the Dockerfile's `build`
      # stage via buildx cache. Each image is published at
      # ghcr.io/<owner>/<binary> with the release tag and `latest`.

      # Mirrors GoReleaser's {{.Version}} / {{.Commit}} / {{.Date}} so
      # binaries inside the images report the same buildinfo as the
      # tarball binaries.
      - name: Compute Docker build metadata
        run: |
          {
            echo "BUILD_VERSION=${GITHUB_REF_NAME#v}"
            echo "BUILD_COMMIT=${GITHUB_SHA}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Docker meta — prosa (CLI)
        id: meta-cli
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/prosa
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push prosa (CLI) image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prosa
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-cli.outputs.tags }}
          labels: ${{ steps.meta-cli.outputs.labels }}
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
            COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}

      - name: Docker meta — prosa-server
        id: meta-server
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/prosa-server
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push prosa-server image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prosa-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
            COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}

      - name: Docker meta — prosa-panel
        id: meta-panel
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/prosa-panel
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push prosa-panel image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prosa-panel
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-panel.outputs.tags }}
          labels: ${{ steps.meta-panel.outputs.labels }}
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
            COMMIT=${{ env.BUILD_COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
